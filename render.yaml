services:
  - type: web
    name: coil-geometry-api
    runtime: python
    rootDir: physics
    buildCommand: pip install -e ".[dev]"
    startCommand: uvicorn physics.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app  # replace with actual Vercel URL before go-live
